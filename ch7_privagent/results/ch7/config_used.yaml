seed: 20261026
replications: 20
n_jobs: 2
environment:
  python: 3.10.20
  packages:
  - numpy
  - scipy
  - pandas
  - statsmodels
  - matplotlib
  - pyyaml
  - pytest
  extra_packages:
  - joblib
  - pyarrow
populations:
  uniform:
    code: 0
    alpha:
    - 1.0
    - 1.0
    - 1.0
    n: 1000
  profiles:
    concentration: 20
    n: 250
    centers:
      privacy_focused:
        code: 1
        c:
        - 0.6
        - 0.2
        - 0.2
      accuracy_focused:
        code: 2
        c:
        - 0.2
        - 0.6
        - 0.2
      balanced:
        code: 3
        c:
        - 0.3333333333333333
        - 0.3333333333333333
        - 0.3333333333333333
      resource_constrained:
        code: 4
        c:
        - 0.2
        - 0.2
        - 0.6
stream_offsets:
  true_weights: 0
  dialogue_pa6: 1
  dialogue_lpla: 2
  slider_noise: 3
  bayes_draws_pa6: 4
  bayes_draws_lpla: 5
response:
  tau: 0.1
  tau_grid:
  - 0.05
  - 0.1
  - 0.2
  - 0.4
  tau_sanity: 1.0e-06
slider:
  anchor:
  - 0.3333333333333333
  - 0.3333333333333333
  - 0.3333333333333333
  lambda: 0.4
  lambda_grid:
  - 0.0
  - 0.2
  - 0.4
  - 0.6
  noise_sd: 0.1
prompts:
  third_level: 0.5
  contrasts:
    strong:
      h: 0.9
      l: 0.1
      kappa: 1.0
    medium:
      h: 0.75
      l: 0.25
      kappa: 0.75
    weak:
      h: 0.6
      l: 0.4
      kappa: 0.5
  sets:
    pa6:
    - - LP-LA
      - strong
    - - LP-LA
      - medium
    - - LP-CR
      - strong
    - - LP-CR
      - medium
    - - LA-CR
      - strong
    - - LA-CR
      - medium
    lpla:
    - - LP-LA
      - strong
    - - LP-LA
      - strong
    - - LP-LA
      - medium
    - - LP-LA
      - medium
    - - LP-LA
      - weak
    - - LP-LA
      - weak
  order: random permutation per user (both sets)
  repair:
    applies_to: pa6
    contrast: strong
  rounds:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
inference:
  vote: start (1/3,1/3,1/3); +Delta_p to the winner, -Delta_p to the loser; project
    max(w,0)/sum at the end
  bayes:
    prior:
    - 1.0
    - 1.0
    - 1.0
    draws: 20000
    analyst_tau: 0.1
    estimate: posterior_mean
methods:
  oracle:
    id: 0
    display: Oracle
  pa6:
    id: 1
    display: PrivAgent-6
  pa6_bayes:
    id: 2
    display: PrivAgent-6-Bayes
  lpla:
    id: 3
    display: PrivAgent-LPLA
  lpla_bayes:
    id: 4
    display: PrivAgent-LPLA-Bayes
  expert:
    id: 5
    display: Expert default
    w:
    - 0.4
    - 0.4
    - 0.2
  uniform_default:
    id: 6
    display: Uniform default
    w:
    - 0.3333333333333333
    - 0.3333333333333333
    - 0.3333333333333333
  slider:
    id: 7
    display: Anchored slider
uldp:
  candidates:
  - 0.1
  - 0.3
  - 1.0
  - 5.0
  - 10.0
  settings:
  - - adult
    - linear
  - - adult
    - exponential
  - - cdc
    - linear
  - - cdc
    - exponential
  ties: smallest_eps
metrics:
  privacy_share: pi = w_LP / (w_LP + w_LA), pi = 0.5 when w_LP + w_LA = 0
  closeness_loss: C_true(eps*_true) - C_true(eps*_method), with the true weights
stats:
  bootstrap_resamples: 10000
  ci: 0.95
  alpha: 0.05
  bootstrap_seed: 20261027
  mcnemar: statsmodels mcnemar on the paired 2x2 table pooled over replications; exact
    binomial if b + c < 25, else chi-square with continuity correction; two-sided
  wilcoxon: scipy.stats.wilcoxon on per-user paired differences, zero_method='wilcox',
    two-sided
  families:
    G1:
      hypothesis: H1
      a: pa6
      b: expert
      metric: agreement
      settings:
      - - adult
        - linear
      - - cdc
        - linear
      test: mcnemar
      direction: greater
    G2:
      hypothesis: H2
      a: lpla
      b: pa6
      metric: agreement
      settings:
      - - adult
        - linear
      - - cdc
        - linear
      test: mcnemar
      direction: greater
    G3:
      hypothesis: H3
      a: pa6_bayes
      b: pa6
      metric: share_error
      test: wilcoxon
      direction: less
    G4:
      hypothesis: H4
      a: pa6
      b: slider
      metric: agreement
      settings:
      - - adult
        - linear
      - - cdc
        - linear
      test: mcnemar
      direction: greater
    G5:
      hypothesis: H5
      a: pa6
      b: expert
      metric: cosine
      test: wilcoxon
      direction: less
outputs:
  dir: results/ch7
  weights_figure:
    replication: 0
    users: 300
_versions:
  numpy: 1.26.4
  scipy: 1.15.3
  pandas: 2.3.3
  statsmodels: 0.15.0
  matplotlib: 3.10.9
  PyYAML: 6.0.3
  pytest: 9.1.1
  joblib: 1.6.0
  pyarrow: 25.0.1
_python: 3.10.20 (main, Jul 18 2026, 17:02:35) [Clang 22.1.3 ]
