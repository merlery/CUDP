# Chapter 7 (PrivAgent) simulation experiment. Every setting is fixed here before the main run and
# committed together with hypotheses.md, src/ and tests/ (pre-registration). Later changes are listed
# under "Deviations" in results/ch7/summary.md, and the results they affect are labeled exploratory.
# `python -m src.run && python -m src.report` reproduces everything from this file.

seed: 20261026
replications: 20
n_jobs: 2                       # joblib workers over replications

environment:
  python: "3.10.20"
  packages: [numpy, scipy, pandas, statsmodels, matplotlib, pyyaml, pytest]
  # Two packages beyond the listed dependencies are used: joblib (the layout asks for "joblib over
  # replications") and pyarrow (needed to write the required .parquet files).
  extra_packages: [joblib, pyarrow]

# All randomness: np.random.default_rng([seed, replication, stream]) with
# stream = 100 * population_code + stream_offset.
populations:
  uniform: {code: 0, alpha: [1.0, 1.0, 1.0], n: 1000}
  profiles:
    concentration: 20           # w* ~ Dirichlet(20 * c)
    n: 250
    centers:                    # (w_LP, w_LA, w_CR); code = population code
      privacy_focused:      {code: 1, c: [0.6, 0.2, 0.2]}
      accuracy_focused:     {code: 2, c: [0.2, 0.6, 0.2]}
      balanced:             {code: 3, c: [0.3333333333333333, 0.3333333333333333, 0.3333333333333333]}
      resource_constrained: {code: 4, c: [0.2, 0.2, 0.6]}
stream_offsets:
  true_weights: 0               # Dirichlet draws of w*
  dialogue_pa6: 1               # PrivAgent-6: prompt order, answer draws, repair draw
  dialogue_lpla: 2              # PrivAgent-LPLA: prompt order, answer draws (repair draw unused)
  slider_noise: 3               # eta ~ N(0, noise_sd^2 I), drawn once per user and shared by every lambda
  bayes_draws_pa6: 4            # 20,000 Dirichlet(1,1,1) prior draws, shared by the users of a replication
  bayes_draws_lpla: 5
# The same streams are used for every tau of the sensitivity analysis and for the tau -> 0 sanity check,
# so answers are coupled across tau (common random numbers): a user answers A when u < P(A; tau).

response:
  tau: 0.1                      # primary user temperature
  tau_grid: [0.05, 0.1, 0.2, 0.4]
  tau_sanity: 1.0e-6
  # P(A) = sigmoid((U(A) - U(B)) / tau), U(o) = w* . m(o). Simulated users have no anchoring in the
  # dialogue, no present bias, and no context-dependence.

slider:
  anchor: [0.3333333333333333, 0.3333333333333333, 0.3333333333333333]
  lambda: 0.4
  lambda_grid: [0.0, 0.2, 0.4, 0.6]
  noise_sd: 0.1
  # w_rep = lambda * a + (1 - lambda) * (w* + eta), clipped at 0 and renormalized (uniform if all zero).

prompts:
  third_level: 0.5
  contrasts:
    strong: {h: 0.9,  l: 0.1,  kappa: 1.0}
    medium: {h: 0.75, l: 0.25, kappa: 0.75}
    weak:   {h: 0.6,  l: 0.4,  kappa: 0.5}
  sets:
    pa6:  [[LP-LA, strong], [LP-LA, medium], [LP-CR, strong], [LP-CR, medium], [LA-CR, strong], [LA-CR, medium]]
    lpla: [[LP-LA, strong], [LP-LA, strong], [LP-LA, medium], [LP-LA, medium], [LP-LA, weak], [LP-LA, weak]]
  order: "random permutation per user (both sets)"
  repair:
    applies_to: pa6
    contrast: strong
    # After the six answers, each pair's two answers give +1 (both favor the first criterion), -1 (both
    # favor the second) or 0 (split). A cycle is (LP-LA, LP-CR, LA-CR) = (+1, -1, +1) or (-1, +1, -1).
    # Clarification of the specification, fixed before the main run: a cycle needs all three pairs
    # decided, so no pair is split when a cycle is detected. The rule "repair the split pair; if several
    # are split, the first in the order (LP-LA, LP-CR, LA-CR)" is therefore applied as "the first split
    # pair in that order, or the first pair (LP-LA) when none is split"; in practice every repair prompt
    # goes to LP-LA. The repair answer is added as a seventh answer (kappa of the strong contrast).
  rounds: [1, 2, 3, 4, 5, 6]
  # Rounds analysis (PrivAgent-6, vote inference): the first k prompts of the presented order. For
  # k < 6 there is no repair step (the check needs both answers of every pair); k = 6 is PrivAgent-6 as
  # defined above, including the check and the repair. Delta_p = kappa_p / sum of kappa over the
  # answers used in that session.

inference:
  vote: "start (1/3,1/3,1/3); +Delta_p to the winner, -Delta_p to the loser; project max(w,0)/sum at the end"
  bayes:
    prior: [1.0, 1.0, 1.0]
    draws: 20000
    analyst_tau: 0.1            # equal to the primary tau in every analysis, including the tau sensitivity
    estimate: posterior_mean    # self-normalized importance sampling over the prior draws

methods:
  # id = reporting order
  oracle:          {id: 0, display: "Oracle"}
  pa6:             {id: 1, display: "PrivAgent-6"}
  pa6_bayes:       {id: 2, display: "PrivAgent-6-Bayes"}
  lpla:            {id: 3, display: "PrivAgent-LPLA"}
  lpla_bayes:      {id: 4, display: "PrivAgent-LPLA-Bayes"}
  expert:          {id: 5, display: "Expert default", w: [0.4, 0.4, 0.2]}
  uniform_default: {id: 6, display: "Uniform default", w: [0.3333333333333333, 0.3333333333333333, 0.3333333333333333]}
  slider:          {id: 7, display: "Anchored slider"}

uldp:
  candidates: [0.1, 0.3, 1.0, 5.0, 10.0]
  # Decision matrices: Chapter 6, Table 6.1 (hard-coded in src/uldp.py). CR = 1 for every candidate.
  settings: [[adult, linear], [adult, exponential], [cdc, linear], [cdc, exponential]]
  ties: smallest_eps
  # An undefined selection (every C is 0/0, i.e. w_LP = w_LA = 0) counts as disagreement in budget
  # agreement, is excluded from the mean closeness loss, and is reported as the share of undefined
  # selections.

metrics:
  privacy_share: "pi = w_LP / (w_LP + w_LA), pi = 0.5 when w_LP + w_LA = 0"
  closeness_loss: "C_true(eps*_true) - C_true(eps*_method), with the true weights"

stats:
  bootstrap_resamples: 10000    # cluster bootstrap over replications (pooled point estimates)
  ci: 0.95
  alpha: 0.05
  bootstrap_seed: 20261027
  mcnemar: "statsmodels mcnemar on the paired 2x2 table pooled over replications; exact binomial if b + c < 25, else chi-square with continuity correction; two-sided"
  wilcoxon: "scipy.stats.wilcoxon on per-user paired differences, zero_method='wilcox', two-sided"
  families:
    G1: {hypothesis: H1, a: pa6, b: expert, metric: agreement, settings: [[adult, linear], [cdc, linear]], test: mcnemar, direction: greater}
    G2: {hypothesis: H2, a: lpla, b: pa6, metric: agreement, settings: [[adult, linear], [cdc, linear]], test: mcnemar, direction: greater}
    G3: {hypothesis: H3, a: pa6_bayes, b: pa6, metric: share_error, test: wilcoxon, direction: less}
    G4: {hypothesis: H4, a: pa6, b: slider, metric: agreement, settings: [[adult, linear], [cdc, linear]], test: mcnemar, direction: greater}
    G5: {hypothesis: H5, a: pa6, b: expert, metric: cosine, test: wilcoxon, direction: less}
  # Primary population (uniform), primary tau and lambda, all replications pooled. Holm within each
  # family. A test counts in the stated direction if the Holm-adjusted p < 0.05 and the pooled mean
  # difference A - B has the stated sign. pass = every test of the family; partial = some; fail = none.

outputs:
  dir: results/ch7
  weights_figure: {replication: 0, users: 300}
