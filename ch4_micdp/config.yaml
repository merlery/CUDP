                 sha256: a2a9044bc167a35b2361efbabec64e89d69ce82d9790d2980119aac5fd7e9c05,
                 note: "UCI id 2 test file (labels end with '.')"}
    adult_names: {file: adult.names, url: "https://raw.githubusercontent.com/mikeizbicki/datasets/master/csv/uci/adult.names",
                  sha256: c248284c0b5de30c9e1958d6cdd168a34a654758b620e68f46aefa83fc0a576a}
    cdc: {file: diabetes_binary_health_indicators_BRFSS2015.csv,
          url: "https://raw.githubusercontent.com/kli252/cdc_diabetes_indicator_dataset/main/diabetes_binary_health_indicators_BRFSS2015.csv",
