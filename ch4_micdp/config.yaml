  # from GitHub mirrors and verified (row counts, SHA-256, identical copies across mirrors).
  files:
    adult_data: {file: adult.data, url: "https://raw.githubusercontent.com/mikeizbicki/datasets/master/csv/uci/adult.data",
                 sha256: df25a4e32ed6f1bd4b3910d21a7bd661a09061eced7cb45555a519d9667cc87b,
