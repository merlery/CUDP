                 note: "Original authors' repository (Candanedo et al. 2017); same file as UCI id 374"}

splits: {public: 0.15, train: 0.65, test: 0.20}

ranges:
  fallback_percentiles: [0.5, 99.5]   # of the PUBLIC split, only when no documented range exists

synthetic:
  n: 20000
  d: 20
  block_size: 4
  within_block_corr: 0.5
  informative: [0, 4, 8, 12, 16]
  variants:
    syn_lin:     {signal: linear,    lambda: 1.0}
    syn_nl_low:  {signal: nonlinear, lambda: 0.5}
    syn_nl_mid:  {signal: nonlinear, lambda: 1.0}
    syn_nl_high: {signal: nonlinear, lambda: 2.0}

