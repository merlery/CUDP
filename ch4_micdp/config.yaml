# ============================================================================= public-data baselines
# Added 2026-11-07 (python -m src.public && python -m src.public_report). Nothing above this line was
# changed: every existing method, split, seed, range and hyperparameter is as in the v2 run. This
# section is not part of the hash of the main experiment (run.EXPERIMENT_KEYS), so the main-run cache
# and results are unaffected. Reporting rules: public_reporting_rules.md (committed before the run).
public_baselines:
  datasets: [adult, cdc_diabetes]
  eps_grid: [0.1, 0.3, 0.5, 1.0, 5.0, 10.0]      # = privacy.eps_grid; eps_index as in the main run
  n_trials: 30                                   # trial t uses seed 1000 + t (paired with the main run)
  n_jobs: 2                                      # joblib (loky) workers over (dataset, trial); 1 OpenMP thread each, as in the main run
  out_dir: results/ch4/public
  public_subsample_seed: 20261107
  shift_seed: 20261108
  bootstrap_seed: 20261109
  # Public splits. p15 = the existing public split (15% of the dataset). p5 and p1 = 5% and 1% of the
  # dataset (round(0.05 n) and round(0.01 n) records, n = rows used: Adult 48,842, CDC-Diabetes 60,000),
  # by stratified subsampling (sklearn train_test_split, stratify = label): p5 from p15 with
  # random_state = public_subsample_seed, p1 from p5 with random_state = public_subsample_seed + 1, so
  # p1 is a subset of p5, which is a subset of p15.
  sizes: {p15: 0.15, p5: 0.05, p1: 0.01}
  n_records:
    adult:        {p15: 7327, p5: 2442, p1: 488, shift5: 2442}
    cdc_diabetes: {p15: 9000, p5: 3000, p1: 600, shift5: 3000}
  # Shifted public split (exploratory): round(0.05 n) records drawn uniformly without replacement
  # (np.random.default_rng(shift_seed), not stratified) from the records of the 15% public split whose
  # covariate is <= its median on the 15% public split (original units).
  shift:
    covariate: {adult: age, cdc_diabetes: Age}
    median:    {adult: 38.0, cdc_diabetes: 8.0}   # computed on the public 15% split
    pool_size: {adult: 3868, cdc_diabetes: 4607}  # public records with covariate <= median
    size: 0.05
  # SHA-256 of the splits used by the main run (src/data.prepare, unchanged code, pinned raw files);
  # the run stops if any differs.
  split_hashes:
    adult:
      X_train: c747c97e9af191a162c5926a389c8992fa6a29e7d7bb4f681b93661ba08b44c0
      y_train: a8ee3768e25c88159702fae342c5a38849ab4a35154809d7f148c83a3984ae17
      X_test:  93904e4194b0d90031dbfed3145106e417e6bf217991a6adb256c74c43d64c16
      y_test:  738b897a442d1808d36473749fe92668c9591aa90c4275932fcacb1c8b854dba
      idx_train: eddab26383d81d6de139824d31065ccd03398c1ed121b9da910b6e892ee1ae34
      idx_test:  37954755e50c277cf42e5a5775266b22d88a9f1bca59e8ed1ea874331a34685a
      X_public: dffc4cd9c4d1ed05fdfb0b58b505f0b2d68cfb5406ae5fb0789de02cae5943f3
    cdc_diabetes:
      X_train: 8e8a82606d3061ad9b8df147f7aa35bf0ac00a9ecb079f3cff9ebdcf9bc933a5
      y_train: 73c5574d69060b0a7c9aa44229a0edd7125d0bcf810456350c293315f97547bf
      X_test:  b6a9e3cab3cca8a5e85acb52a11837928a6be81546ad3a65840aa765d642140a
      y_test:  d5e3f4d4e87247de59121132df937a370cd190dab9624f4166aa9eeac83796ea
      idx_train: 45da71cd5004899f23c1225bbc093d9c364fedbccbd532029e875b073152ea84
      idx_test:  2da6c752f628a46bca345ba9b10f7ffe789225d3ae993f8a3b2b0fc14e85cddf
      X_public: dc5f025cd9fd3cd735133b06c5ccdde7a91e7b624a26c503df22e6c2a415a053
  # New methods. Models are those of the main run (models: primary HistGradientBoosting, 200 iterations,
  # no early stopping, random_state = trial seed; secondary LogisticRegression C = 1, max_iter = 2000).
  # Noise-aware prediction (exact tree expectation, src/noiseaware.py) is applied to the primary model
  # of every method that trains on a privatized release, as in the main run; the secondary model and
  # Public-Only predict on the clean test inputs.
  methods:
    public_only:
      # Clean public split (p15, p5, p1, shift5), all d features; no private record is touched; no RNG.
      sizes: [p15, p5, p1, shift5]
    ft_uniform:
      # Pretrain on the clean public split, then continue on the Uniform release of the main run
      # (stream [seed, 1, eps_index]: the same privatized copy as Uniform).
      release: uniform
      sizes: [p15, p5]
    ft_mic_dp:
      # Same with the MIC-DP release of the main run (stream [seed, 2, eps_index]: same score draw and
      # mechanism noise as MIC-DP). The public rows use the same released columns J as the release.
      release: mic_dp
      sizes: [p15, p5]
    pooled_uniform:
      # Clean public rows (all columns, = J for Uniform) stacked on the Uniform release of the main run.
      release: uniform
      sizes: [p15, p5]
    mic_public_small:
      # MIC-Public with FG-MIC scores computed on the smaller (or shifted) public split; the candidate
      # cut points and the bound B(n) = n^0.55 come from that same split (n = its size); classification
      # rows = the classes. Mechanism as MIC-Public (rho = 0, B = 1 rule, withholding), own noise stream
      # [seed, id, eps_index]. Public ranges are unchanged (15% split).
      ids: {p5: 21, p1: 22, shift5: 23}
  fine_tuning:
    primary: "HistGradientBoostingClassifier(max_iter=100, warm_start=True, early_stopping=False, random_state=seed) fit on the public rows, then set_params(max_iter=200) and fit on the privatized rows (100 more iterations)"
    # Correction of sklearn's warm start, fixed before the run: when warm_start continues on a different
    # dataset, sklearn refits the bin mapper on the new rows and computes the starting raw predictions
    # of the existing trees from the new bins with the old trees' bin thresholds. On a diagnostic with
    # the PUBLIC Adult split and synthetic N(0, 5^2) noise (no private record), these starting values
    # differed from the model's actual output on the new rows by up to 17.2 in logit (correlation 0.58).
    # src/public.ContinuedHGBClassifier therefore computes the starting raw predictions from the unbinned
    # new rows with the numeric thresholds of the existing trees (the values the ensemble outputs); the
    # new trees then fit the gradients of the combined model. On identical data the result equals one
    # 200-iteration fit exactly (unit test).
    secondary: "LogisticRegression(C=1, max_iter=2000, warm_start=True) fit on the public rows, then fit on the privatized rows (lbfgs starts from the public solution)"
    prediction: "noise-aware expectation over the release noise of the whole 200-tree ensemble (primary); clean predict_proba (secondary)"
  pooled:
    prediction: "noise-aware with the Uniform noise scales sigma_j (primary): E over eta ~ N(0, diag(sigma^2)) of f(x + eta), the noise of the private rows; public rows carry zero noise, so no other noise distribution enters; the expectation is not mixed with a clean prediction"
  # Sanity checks: p1 in p5 in p15; splits = split_hashes; Public-Only fit matrix = X_public[S] (SHA-256)
  # and S disjoint from the private-train indices; pretrained model (100 iterations) = stage 100 of the
  # 200-iteration Public-Only model on the test inputs to 1e-9 (primary; when the release withholds
  # columns, the reference is a 200-iteration public fit on the same columns) and pretrained logistic
  # regression = Public-Only logistic regression (when all columns are released); existing methods
  # (Non-private, Uniform, MIC-DP, MIC-Public) re-run for trial 0 match raw_trials.parquet to 1e-9 in
  # ROC-AUC and accuracy for both models.
  # Best private method of the main comparison (highest mean ROC-AUC of Uniform, MIC-DP, MIC-Public in
  # results/ch4/raw_trials.parquet, primary model), fixed before any new run:
  best_private:
    adult:        {0.1: mic_dp, 0.3: mic_public, 0.5: mic_public, 1.0: mic_public, 5.0: mic_public, 10.0: mic_public}
    cdc_diabetes: {0.1: mic_public, 0.3: mic_public, 0.5: mic_public, 1.0: mic_public, 5.0: mic_public, 10.0: mic_public}
  best_private_means:   # mean ROC-AUC (Uniform, MIC-DP, MIC-Public) used for the choice
    adult:        {0.1: [0.5315, 0.5468, 0.5466], 0.3: [0.6056, 0.5722, 0.6719], 0.5: [0.6679, 0.6117, 0.6799], 1.0: [0.7083, 0.7048, 0.7796], 5.0: [0.7985, 0.8196, 0.8202], 10.0: [0.8010, 0.8227, 0.8275]}
    cdc_diabetes: {0.1: [0.5104, 0.4976, 0.5460], 0.3: [0.5827, 0.6069, 0.6979], 0.5: [0.6259, 0.5830, 0.7157], 1.0: [0.7117, 0.6904, 0.7925], 5.0: [0.7923, 0.7896, 0.7993], 10.0: [0.7976, 0.7983, 0.8003]}
  stats:
    # Primary model, ROC-AUC, 30 paired trials. G = AUC(method) - AUC(Public-Only at the same public size)
    # per trial; mean and 95% percentile bootstrap interval (10,000 resamples of trials); paired
    # two-sided Wilcoxon (scipy, zero_method="wilcox"; p = 1 if every difference is 0).
    # "Significantly better" = Holm-adjusted p < 0.05 within the family and mean difference > 0.
    F6: "best private method (best_private) vs Public-Only, 2 datasets x {p15, p5, p1} x 6 eps = 36 tests, G = AUC(best) - AUC(Public-Only)"
    F7: "reporting item 3: each of ft_uniform, ft_mic_dp, pooled_uniform at p15 and p5 against each parent (Public-Only at the same size; the private method alone: Uniform for ft_uniform and pooled_uniform, MIC-DP for ft_mic_dp), 2 datasets x 6 eps x 2 sizes x 3 methods x 2 parents = 144 tests"
    F8: "reporting item 4: MIC-Public (p15, p5, p1) vs MIC-DP, 2 datasets x 3 sizes x 6 eps = 36 tests"
    shift: "exploratory, no family: mean differences with bootstrap intervals and unadjusted Wilcoxon p"
    UR: "(mean U_m - mean U_Uniform) / (mean U_NonPrivate - mean U_Uniform) per (dataset, eps), ratio of trial means, bootstrap interval over trials, as in the main run"

# ============================================================================= Draft 3 follow-up runs
# Added 2026-11-12 (python -m src.draft3 && python -m src.draft3_report). Nothing above this line was
# changed. This section is not part of run.EXPERIMENT_KEYS, so the main-run and public-baseline caches
# and results are unaffected. Notes fixed before each part: draft3_notes.md (committed with this section,
# before any of the parts ran).
draft3:
  datasets: [adult, cdc_diabetes]
  eps_grid: [0.1, 0.3, 0.5, 1.0, 5.0, 10.0]      # = privacy.eps_grid; eps_index as in the main run
  n_trials: 30                                   # seed 1000 + t, paired with the main run
  n_jobs: 2
  out_dir: results/ch4/draft3
  bootstrap_seed: 20261112                       # rng = default_rng([bootstrap_seed, family_index, test_index])
  bootstrap_resamples: 10000
  ci: 0.95
  # Every new fit uses the primary model of the main run: HistGradientBoostingClassifier(max_iter=200,
  # early_stopping=False, random_state=seed); for Part C the fine-tuning protocol of public_baselines.
  refit:
    # Parts A.1 (diagnostics of low trials), A.2 and B. Predictions are not stored in raw_trials.parquet
    # (only ROC-AUC, accuracy and n_unique_pred), so the primary model of Uniform, MIC-DP and MIC-Public is
    # refit on the stored release: stream [seed, method_id, eps_index] through src/public.release (the
    # unchanged allocate and weighted_gaussian_subset), the same model and seed. Sanity check: the
    # noise-aware ROC-AUC and accuracy of every refit equal raw_trials.parquet to 1e-9 (1080 fits).
    methods: [uniform, mic_dp, mic_public]
    predictions:
      noise_aware: "predict_noise_aware(model, X[:, keep], sigma[keep]) (src/noiseaware.py), as in the main run"
      direct: "model.predict_proba(X[:, keep])[:, 1] on the clean inputs"
    threshold:
      # A.2: t* = the threshold that maximizes balanced accuracy of the noise-aware prediction on the
      # clean 15% public split (labels of the public split; the split is not privatized). Rule: predict 1
      # if p >= t. Candidates: the sorted distinct noise-aware probabilities on the public split and
      # +inf (all 0); ties broken by the smallest candidate. t* is then applied to the clean test set.
      balanced_accuracy: "sklearn balanced_accuracy_score = (TPR + TNR) / 2"
    low_trials:
      # A.1: trials with stored ROC-AUC < 0.45 at eps <= 0.5. Features the model "splits on most": total
      # split gain per feature over the 200 trees (node field 'gain'), and the number of splits; top 3
      # by gain are reported. Sign of the association between the noise-aware score and the label:
      # sign(AUC - 0.5) of the noise-aware score on (i) the clean test set, (ii) the clean public split,
      # and of the direct prediction on (iii) the privatized training rows the model was fit on.
      threshold: 0.45
  part_a:
    a1_bins: [0.45, 0.55]                        # counts: < 0.45, [0.45, 0.55], > 0.55 (stored ROC-AUC)
    a1_eps: [0.1, 0.3, 0.5]
    a1_hist_bin_width: 0.02
    a3_cells: [[cdc_diabetes, 5.0], [adult, 0.5], [cdc_diabetes, 0.5]]   # MIC-DP - Uniform, primary model
    # A.3: paired differences from raw_trials.parquet; 95% percentile bootstrap, 10,000 resamples,
    # rng default_rng([bootstrap_seed, 3, cell_index]). Also reported: the stored F1 interval of
    # stats.csv and the 90% interval from the same resamples.
    # A.4: per-cell outcomes of F1 and F1_secondary from stats.csv side by side; F1_secondary is
    # recomputed from the secondary-model rows of raw_trials.parquet with src/stats.run_family to decide
    # whether it was computed from those rows or copied from F1.
  part_b:
    methods: [uniform, mic_dp]
    # difference = AUC(noise-aware) - AUC(direct) per trial; 24 tests (2 datasets x 2 methods x 6 eps),
    # paired two-sided Wilcoxon (zero_method="wilcox"; p = 1 if all differences are 0), Holm over the 24.
    # Claim fixed before the run: "noise-aware prediction improves ROC-AUC for Uniform at every budget on
    # both datasets". It holds if and only if all 12 Uniform tests are significant (Holm p < 0.05) with
    # a positive mean difference. Constant prediction: n_unique_pred == 1 on the test set.
    family_index: 10
  part_c:
    # Repair chosen and recorded before any rerun (task statement): (1) the starting raw score of the
    # continued boosting stage is clip(baseline + trees 1-100 evaluated on the privatized rows, -3, 3)
    # instead of the unclipped raw score; (2) l2_regularization = 1.0 for trees 101-200 (the pretrained
    # trees keep l2_regularization = 0 of the main model, so the pretrained model is unchanged).
    # Pretraining, public splits, release streams and everything else as in public_baselines.
    methods: [ft_uniform, ft_mic_dp]
    sizes: [p15, p5]
    start_clip: 3.0
    l2_continued: 1.0
    # Prediction of the repaired model: f(x) = clip(F_pre(x), -3, 3) + F_cont(x), the function the continued
    # trees were fit to (F_pre = baseline + trees 1-100, F_cont = trees 101-200). Noise-aware (as amended
    # before the main run, see draft3_notes.md and Deviations): clip(E[F_pre(x + eta)], -3, 3) + E[F_cont(x + eta)],
    # eta ~ N(0, diag(sigma^2)) of the release, both expectations exact (src/noiseaware.expected_raw).
    # Fixed in commit 8b2e018 and replaced after the smoke unit: E[clip(F_pre(x + eta))] with the two tail
    # terms of the clip by Monte Carlo (K = 256 draws per test record, stream [seed, 51, eps_index, size_index,
    # method_index]); its Monte-Carlo error per record exceeded the spread of E[F_pre] across test records.
    # Largest leaf value: max |node value| over the leaves of trees 101-200 (sklearn stores the value after
    # the learning-rate shrinkage, as in diagnostics/ft_leaf_values.py); also over trees 1-100.
    # F7r: per dataset, {ft_uniform, ft_mic_dp} x {p15, p5} x 6 eps x {vs Public-Only at the same size
    # (stored, raw_trials_public.parquet), vs the private parent (stored Uniform / MIC-DP, raw_trials.parquet)}
    # = 48 tests, Holm within the 48 (family F7r_adult, F7r_cdc_diabetes). The stored (unrepaired) results
    # and their F7 outcomes (Holm over 144) are printed next to them.
    family_index: {adult: 20, cdc_diabetes: 21}
  part_d:
    # Random-k (per record) and Random-k-fixed. k = d/4 and d/2 rounded half up: Adult (d = 12) 3 and 6;
    # CDC-Diabetes (d = 21) 5 and 11. Budget: the whole (eps, delta), no score release.
    k: {adult: [3, 6], cdc_diabetes: [5, 11]}
    ids: {per_record_q: 41, per_record_h: 42, fixed_q: 43, fixed_h: 44}   # q = d/4, h = d/2
    # Stream [seed, id, eps_index]. Draw order: (1) the subset: per record, U = rng.random((n, d)) and the
    # k columns with the smallest U in each row are released; fixed, rng.choice(d, size=k, replace=False)
    # for all rows; (2) Z = rng.standard_normal((n, d)); X_tilde = X + s Z on released entries and m_j on
    # unreleased entries, s = sqrt(k) c(eps, delta) (features scaled to [0, 1], range 1), m_j = mean of
    # feature j on the 15% public split.
    # Model: primary model on all d columns of X_tilde.
    # Noise-aware prediction (exact): the expected model output under the release distribution of a
    # record. A released coordinate is x_j + N(0, s^2); an unreleased coordinate carries no information
    # about x_j (infinite noise) and takes the value m_j it had in training. Per record, the released set
    # is a uniform k-subset, so a leaf with path features P has probability
    # sum_a [C(d - |P|, k - a) / C(d, k)] * e_a, where e_a is the a-th coefficient of
    # prod_{j in P} (1[m_j in I_j] + z (Phi((hi_j - x_j)/s) - Phi((lo_j - x_j)/s))). Fixed: the released set is
    # the drawn subset (unreleased columns are constant in training and are never split on).
    # F9: 2 datasets x 4 variants x 6 eps x {vs Uniform, vs MIC-DP} (stored, primary) = 96 tests, Holm.
    family_index: 30
