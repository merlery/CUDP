    calhousing: {file: cal_housing.data, url: "https://raw.githubusercontent.com/mikeizbicki/datasets/master/csv/statlib/cal_housing.data",
                 sha256: a2b44dcc7e1c9091b43c4f458b25cbd1f7e8068d08edd26bc4703108d3fa6214,
