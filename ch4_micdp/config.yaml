      age:            {range: [17, 90], source: "documentation (UCI Adult: age 17-90)"}
      workclass:      {categories: [Private, Self-emp-not-inc, Self-emp-inc, Federal-gov, Local-gov, State-gov, Without-pay, Never-worked, "?"],
                       source: "adult.names category list + '?' (UCI variables table marks missing values)"}
      education-num:  {range: [1, 16], source: "documentation (16 education levels)"}
      marital-status: {categories: [Married-civ-spouse, Divorced, Never-married, Separated, Widowed, Married-spouse-absent, Married-AF-spouse],
                       source: "adult.names category list"}
