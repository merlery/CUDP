# Chapter 4 (MIC-DP) experiment configuration.
# Every design choice is fixed here BEFORE any test-set result was looked at.
# `python -m src.run && python -m src.report` reproduces everything from this file.

seeds:
  subsample: 20260901       # >60k-row datasets: fixed subsample before splitting
  split: 20260902           # public / private-train / test split (split+1 for the 2nd stage)
  score_subsample: 20260903 # (v1 only) score subsample; v2 scores use the full private-train split
  synthetic: 20260904       # synthetic data generation
  bootstrap: 20260905       # bootstrap CIs
  trial_base: 1000          # trial t uses seed = trial_base + t (paired design)

privacy:
  eps_grid: [0.1, 0.3, 0.5, 1.0, 5.0, 10.0]
  delta: 1.0e-5
  bisection: {lo: 1.0e-6, hi: 1.0e+6, iters: 200}

protocol:
  n_trials: 30
  n_jobs: 2                 # joblib workers (machine has 2 CPUs; each worker runs 1 BLAS/OpenMP thread)
  # Per-trial RNG: np.random.default_rng([seed, method_id, eps_index]).
  # Draw order inside one stream: (1) score / moment noise (if rho > 0), (2) the permutation for
  # Random-Alloc, (3) mechanism noise Z ~ N(0,1)^{n x k} for the k released columns; X_tilde = X + Z * sigma.
  # MIC-DP+Override is defined as a modification of the MIC-DP weights of the same trial,
  # so it reuses the MIC-DP score draw (stream of method_id 2) and draws its mechanism
  # noise from its own stream (method_id 9).
  sensitivity:
    datasets: [adult, cdc_diabetes, calhousing, appliances, syn_nl_mid]
    eps: [0.3, 1.0]
    alpha_grid: [0, 1, 2, 5, 10]
    rho_grid: [0.05, 0.1, 0.2, 0.3, 0.5]
    # alpha is the exponent of the relevance rule (v2). Sweep points get their own RNG ids
    # (100 + index for alpha, 200 + index for rho), so the default point (alpha=2, rho=0.2) is an
    # independent replicate of the main MIC-DP run.
    alpha_method_id_base: 100
    rho_method_id_base: 200

methods:
  # Enhanced MIC-DP ("v2", 2026-10-01, at the author's request; design fixed before running it).
  #   alpha: exponent of the relevance rule w_j ~ q_j^alpha (q_j = s_j / max_k s_k); alpha = 0 is
  #          uniform over the released columns.
  #   theta: columns with q_j < theta are not released once the shrunken scores are reliable
  #          (shrinkage factor B >= prune_min_B); below that, q is floored at theta instead.
  #   tau0:  prior spread of relevance scores; caps the James-Stein factor at tau0^2/(tau0^2+sigma^2).
  defaults: {rho: 0.2, alpha: 2.0, theta: 0.2, tau0: 0.1, prune_min_B: 0.5}
  # id = RNG stream id; dp = whether it is part of DP comparisons
  list:
    nonprivate:      {id: 0, display: "Non-private",     dp: false, rho: 0.0, weights: none}
    uniform:         {id: 1, display: "Uniform",         dp: true,  rho: 0.0, weights: uniform}
    mic_dp:          {id: 2, display: "MIC-DP",          dp: true,  rho: 0.2, weights: relevance, score: fgmic}
    mic_public:      {id: 3, display: "MIC-Public",      dp: true,  rho: 0.0, weights: relevance, score: fgmic_public}
    pearson_alloc:   {id: 4, display: "Pearson-Alloc",   dp: true,  rho: 0.2, weights: relevance, score: pearson}
    pearson_adj:     {id: 5, display: "Pearson-Adj",     dp: true,  rho: 0.2, weights: inv_sq,    score: pearson}
    partialcorr_adj: {id: 6, display: "PartialCorr-Adj", dp: true,  rho: 0.2, weights: inv_sq,    score: partialcorr}
    random_alloc:    {id: 7, display: "Random-Alloc",    dp: true,  rho: 0.2, weights: permute,   score: fgmic}
    mic_oracle:      {id: 8, display: "MIC-Oracle",      dp: false, rho: 0.0, weights: relevance, score: fgmic_oracle}
    mic_dp_override: {id: 9, display: "MIC-DP+Override", dp: true,  rho: 0.2, weights: relevance_override, score: fgmic,
                      only: [adult], protected: [race, sex, age]}
  # Random-Alloc and MIC-DP+Override reuse the MIC-DP score draw of the same trial (stream id 2):
  # Random-Alloc shuffles MIC-DP's weight vector with its own stream (same shape, signal removed);
  # the override caps race/sex/age at 1/d. Both draw their mechanism noise from their own stream.

scores:
  # v2: every score is computed on the FULL private-train split (larger n = smaller sensitivity).
  # FG-MIC (src/fgmic.py): fixed-grid MIC. Candidate x cut points = quantiles of the PUBLIC split
  # (n_x_bins bins per feature); y rows = classes (classification) or public-split quantiles with
  # 2..l_max rows (regression); k * l <= B(n) = n^alpha_B; MI / log min(k, l).
  # Per-score sensitivity 3 (1 + ln n) / (n ln 2); the d scores have L2 sensitivity sqrt(d) times that.
  fgmic: {n_x_bins: 32, l_max: 16, alpha_B: 0.55}
  # Pearson / partial correlation: Gaussian release of the first and second moments of
  # z = [x, y01] in [0,1]^(d+1) (L2 sensitivity sqrt((d+1) + (d+1)(d+2)/2) / n), then post-processing.
  # Regression targets are clipped to the public-split [0.5, 99.5] percentiles for this release only.
  moments: {target_percentiles: [0.5, 99.5]}
  partialcorr_ridge: 1.0e-6
  # Scores use the clipped, [0,1]-scaled features (the data the mechanism sees).

models:
  primary:   {name: HistGradientBoosting, max_iter: 200, early_stopping: false, noise_aware: true}  # random_state = trial seed
  # noise_aware (v2): for private methods, the primary model's test prediction is E[f(x + eta)] under the
  # public release noise eta ~ N(0, diag(sigma^2)), computed exactly from the trees (src/noiseaware.py).
  secondary: {classification: {name: LogisticRegression, C: 1.0, max_iter: 2000},
              regression: {name: Ridge, alpha: 1.0}}
  # Raw features are passed as they are (no standardisation), exactly as specified.
  # Accuracy uses the default 0.5 probability threshold.

metrics:
  classification: {primary: roc_auc, secondary: accuracy, higher_is_better: true}
  regression: {primary: mae, secondary: r2, higher_is_better: false}
  # Utility U is "higher is better": U = AUC, or U = -MAE.
  # UR = (U_method - U_uniform) / (U_nonprivate - U_uniform).
  #   UR is always the ratio of trial means (per-trial ratios are unstable when U_nonprivate - U_uniform
  #   is small for a trial). Its uncertainty comes from a bootstrap over trial seeds (paired across methods
  #   and across the synthetic variants, which share trial seeds). Changed from per-trial UR on 2026-10-01,
  #   before any real result was looked at, after a dry run of report.py on fake data showed the blow-up.

stats:
  alpha_level: 0.05
  bootstrap_resamples: 10000
  ci: 0.95
  # Paired two-sided Wilcoxon signed-rank (scipy, zero_method="wilcox"); if every paired
  # difference is 0 the p-value is set to 1. "Significantly better" = Holm-adjusted p < 0.05
  # AND mean paired difference in U > 0.

hypotheses:
  # Decision rules, fixed in advance.
  H1: "pass if, for >=3 of the 4 real datasets, MIC-DP is significantly better than Uniform (F1, Holm) at every eps in {0.1, 0.3, 1.0}; partial if 1-2 datasets qualify or some (dataset, eps) cells are significant; fail otherwise"
  H1_eps: [0.1, 0.3, 1.0]
  H2: "pass if MIC-DP is significantly better than Pearson-Alloc on syn_nl_mid at >=4 of 6 eps (F2, Holm) AND on syn_lin no eps shows a significant difference in either direction; partial if exactly one of the two parts holds"
  H2_min_eps: 4
  H3: "pass if MIC-DP is significantly better than Random-Alloc in >=13 of the 24 (dataset, eps) cells (F3, Holm) with no significant reverse effect; partial if 1-12 significant wins; fail otherwise"
  H3_min_cells: 13
  H4: "per eps, OLS slope of UR(MIC-DP) (ratio of trial means) on log(lambda) over the 3 points syn_nl_low/mid/high; 95% percentile bootstrap CI resampling trial seeds jointly across variants. pass if CI lower bound > 0 at >=4 of 6 eps; partial if at 1-3 eps; fail otherwise"
  H4_min_eps: 4
  H5: "(a) MIC-Public is never significantly worse than MIC-DP (F4, Holm, 24 cells) and (b) for >=3 of 4 real datasets the mean gap U(MIC-Public)-U(MIC-DP) averaged over eps in {0.1,0.3,0.5} exceeds the average over eps in {5,10}. pass if (a) and (b); partial if one holds"
  H5_small_eps: [0.1, 0.3, 0.5]
  H5_large_eps: [5.0, 10.0]
  H6: "Adult, primary model. Loss = AUC(MIC-DP) - AUC(MIC-DP+Override). pass if at every eps the upper 95% bootstrap bound of the mean paired loss is <= 0.01 AUC (equivalence margin); partial if this holds at >=3 of 6 eps; fail otherwise. Holm-adjusted Wilcoxon p-values (F5) are also reported"
  H6_margin: 0.01

