hypotheses:
  H1: pass if, for >=3 of the 4 real datasets, MIC-DP is significantly better than
    Uniform (F1, Holm) at every eps in {0.1, 0.3, 1.0}; partial if 1-2 datasets qualify
    or some (dataset, eps) cells are significant; fail otherwise
  H1_eps:
  - 0.1
  - 0.3
  - 1.0
  H2: pass if MIC-DP is significantly better than Pearson-Alloc on syn_nl_mid at >=4
    of 6 eps (F2, Holm) AND on syn_lin no eps shows a significant difference in either
    direction; partial if exactly one of the two parts holds
  H2_min_eps: 4
  H3: pass if MIC-DP is significantly better than Random-Alloc in >=13 of the 24 (dataset,
    eps) cells (F3, Holm) with no significant reverse effect; partial if 1-12 significant
    wins; fail otherwise
  H3_min_cells: 13
  H4: per eps, OLS slope of UR(MIC-DP) (ratio of trial means) on log(lambda) over
    the 3 points syn_nl_low/mid/high; 95% percentile bootstrap CI resampling trial
    seeds jointly across variants. pass if CI lower bound > 0 at >=4 of 6 eps; partial
    if at 1-3 eps; fail otherwise
  H4_min_eps: 4
  H5: (a) MIC-Public is never significantly worse than MIC-DP (F4, Holm, 24 cells)
    and (b) for >=3 of 4 real datasets the mean gap U(MIC-Public)-U(MIC-DP) averaged
    over eps in {0.1,0.3,0.5} exceeds the average over eps in {5,10}. pass if (a)
    and (b); partial if one holds
  H5_small_eps:
  - 0.1
  - 0.3
  - 0.5
  H5_large_eps:
  - 5.0
  - 10.0
  H6: Adult, primary model. Loss = AUC(MIC-DP) - AUC(MIC-DP+Override). pass if at
    every eps the upper 95% bootstrap bound of the mean paired loss is <= 0.01 AUC
    (equivalence margin); partial if this holds at >=3 of 6 eps; fail otherwise. Holm-adjusted
    Wilcoxon p-values (F5) are also reported
  H6_margin: 0.01
