# pvr_adult_occ_v7_sel_random_k10 - post-hoc robustness rerun (not a reported run): configs/adult_occ_v7_sel_random_k10.yaml with seed 0 only and the
# validation-chosen values (lr 0.05; update bound 0.1 where the reported run used 0.2); was lr 0.1, C 0.2.
# Evaluated on the test split, as the reported run.
name: pvr_adult_occ_v7_sel_random_k10
dataset: adult
partition: group
alpha: null
n_clients: 50
model: mlp_tabular
fl:
  rounds: 200
  participation: 0.2
  local_epochs: 1
  batch_size: 128
  lr: 0.05
  clip_update: 0.1
  momentum: 0.0
  eval_every: 1
seeds:
- 0
eps_grid:
- 20
- 50
- 100
- 200
method:
  method: ldpmic
  delta: 1.0e-05
  sigma0_method: analytic
  eps1_frac: 0.2
  G: 10
  score_release: secagg
  k: 10
  share_mode: uniform
  score: fixed_grid
  score_sensitivity: analytic
  allocation: global
  selection: random
