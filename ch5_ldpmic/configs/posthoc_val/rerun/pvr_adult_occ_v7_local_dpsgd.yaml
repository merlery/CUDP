# pvr_adult_occ_v7_local_dpsgd - post-hoc robustness rerun (not a reported run): configs/adult_occ_v7_local_dpsgd.yaml with seed 0 only and the
# validation-chosen values (lr 0.05; update bound 0.1 where the reported run used 0.2); was lr 0.1, C 0.2.
# Evaluated on the test split, as the reported run.
name: pvr_adult_occ_v7_local_dpsgd
dataset: adult
partition: group
alpha: null
n_clients: 50
model: mlp_tabular
fl:
  rounds: 200
  participation: 0.2
  local_epochs: 1
  batch_size: 128
  lr: 0.05
  clip_update: 0.1
  momentum: 0.0
  eval_every: 1
seeds:
- 0
eps_grid:
- 20
- 50
- 100
- 200
method:
  method: local_dpsgd
  delta: 1.0e-05
  sigma0_method: analytic
  clip_grad: 1.0
  dpsgd_conversion: balle
  dpsgd_calibration: schedule
