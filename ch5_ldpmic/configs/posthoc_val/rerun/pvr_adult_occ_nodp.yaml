  local_epochs: 1
  batch_size: 128
  lr: 0.05
  clip_update: null
  momentum: 0.0
  eval_every: 1
lr_grid:
- 0.01
- 0.05
- 0.1
seeds:
- 0
eps_grid:
- 0.5
- 1
- 2
- 5
- 10
method:
  method: nodp
  delta: 1.0e-05
