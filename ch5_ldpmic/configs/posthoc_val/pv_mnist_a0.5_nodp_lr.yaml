# pv_mnist_a0.5_nodp_lr - post-hoc robustness check (not a reported run): the learning-rate choice of mnist_a0.5_nodp repeated on a validation split
# (15% of each client's training records, seed 0); copied from the stored config of mnist_a0.5_nodp_lr0.1_s0_c93ee935.json.
# Candidates lr {0.01, 0.05, 0.1}; rule: highest final validation accuracy (reproduces every recorded test-split choice).
name: pv_mnist_a0.5_nodp_lr
dataset: mnist
partition: dirichlet
alpha: 0.5
n_clients: 100
model: mlp_image
cache_sanitized: false
fl:
  rounds: 100
  participation: 0.3
  local_epochs: 1
  batch_size: 64
  lr: 0.1
  clip_update: null
  momentum: 0.0
  eval_every: 1
method:
  method: nodp
  delta: 1.0e-05
seeds:
- 0
validation:
  frac: 0.15
  seed: 0
lr_grid:
- 0.01
- 0.05
- 0.1
