# adult_occ_v7_sel_pearson_k10 — selection sweep (DECISIONS.md D39): top-10; ablation: |Pearson| scores, private (conservative sensitivity)
name: adult_occ_v7_sel_pearson_k10
dataset: adult
partition: group
alpha: null
n_clients: 50
model: mlp_tabular
fl:
  rounds: 200
  participation: 0.2
  local_epochs: 1
  batch_size: 128
  lr: 0.1
  clip_update: 0.2        # C tuned on nodp, seed 0 (D31 / D36); utility only
  momentum: 0.0
  eval_every: 1
seeds: [0, 1, 2, 3, 4]
eps_grid: [20, 50, 100, 200]
method:
  method: ldpmic
  delta: 1.0e-5
  sigma0_method: analytic
  eps1_frac: 0.2
  G: 10
  score_release: secagg
  k: 10
  share_mode: uniform
  score: pearson
  score_sensitivity: conservative
  allocation: global
