# bank_occ_v7_sel_random_k20 — selection sweep (DECISIONS.md D39): top-20; random k-subset (control; eps1 unspent)
name: bank_occ_v7_sel_random_k20
dataset: bank
partition: group
alpha: null
n_clients: 50
model: mlp_tabular
fl:
  rounds: 200
  participation: 0.2
  local_epochs: 1
  batch_size: 128
  lr: 0.05
  clip_update: 0.05        # C tuned on nodp, seed 0 (D31 / D36); utility only
  momentum: 0.0
  eval_every: 1
seeds: [0, 1, 2, 3, 4]
eps_grid: [20, 50, 100, 200]
method:
  method: ldpmic
  delta: 1.0e-5
  sigma0_method: analytic
  eps1_frac: 0.2
  G: 10
  score_release: secagg
  k: 20
  share_mode: uniform
  score: fixed_grid
  score_sensitivity: analytic
  allocation: global
  selection: random
