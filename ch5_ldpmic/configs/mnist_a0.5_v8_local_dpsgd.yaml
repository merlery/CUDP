# mnist_a0.5_v8_local_dpsgd — pilot v8 (cost of the input filter): full-input local DP-SGD reference, 3 seeds
name: mnist_a0.5_v8_local_dpsgd
dataset: mnist
partition: dirichlet
alpha: 0.5
n_clients: 100
model: mlp_image
cache_sanitized: false
fl:
  rounds: 100
  participation: 0.3
  local_epochs: 1
  batch_size: 64
  lr: 0.1
  clip_update: 18.357        # median DP-SGD update norm, recorded mnist local_dpsgd eps=1 seed 0 (D32)
  momentum: 0.0
  eval_every: 1
clip_grid: [0.25,0.5,1.0]
seeds: [0, 1, 2]
eps_grid: [1, 5]
method:
  method: local_dpsgd
  delta: 1.0e-5
  clip_grad: 1.0
  dpsgd_conversion: balle
  dpsgd_calibration: schedule
