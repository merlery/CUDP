# adult_occ_v7_local_dpsgd — selection sweep (DECISIONS.md D39): record-level reference with a per-model budget (C_g 1.0, schedule calibration; FL settings as the release methods)
name: adult_occ_v7_local_dpsgd
dataset: adult
partition: group
alpha: null
n_clients: 50
model: mlp_tabular
fl:
  rounds: 200
  participation: 0.2
  local_epochs: 1
  batch_size: 128
  lr: 0.1
  clip_update: 0.2        # C tuned on nodp, seed 0 (D31 / D36); utility only
  momentum: 0.0
  eval_every: 1
seeds: [0, 1, 2, 3, 4]
eps_grid: [20, 50, 100, 200]
method:
  method: local_dpsgd
  delta: 1.0e-5
  sigma0_method: analytic
  clip_grad: 1.0
  dpsgd_conversion: balle
  dpsgd_calibration: schedule
