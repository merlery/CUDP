header: |
  Follow-up runs and diagnostics for Chapter 5.  No stored result was changed: the new runs are in
  `results/ch5/draft3/runs`, the stored runs are read from `results/raw`.  Every choice made before the runs is in
  `config.yaml` (copied with the resolved run configs into `config_used.yaml`).  All tables below are generated by
  `scripts/ch5d3_report.py` from the run files; cells are mean ± sample standard deviation over seeds.  One CSV per
  part (`partA.csv` ... `partF.csv`) holds one row per run.
part_A: |
  Private top-k selection on Adult (occupation, 50 clients) with the score release in local mode (new runs), next to
  the stored runs of the same seed with the secure-aggregation release, a random k-subset and the oracle.  The noise
  column is the standard deviation of the noise on the weighted average of the score vectors (local mode: before the
  per-client clipping to [0, 1]; secure aggregation: the recorded value), with the code's analytic sensitivity bound;
  the exact-score columns are the largest, k-th and (k+1)-th largest entries of the exact averaged score vector.
  In local mode every client clips its noisy vector to [0, 1] before the server averages (the mechanism as
  specified); the second table gives, as a diagnostic without training, the overlap that the average of the
  unclipped noisy vectors would give.
part_B1: |
  **What "failed numerically" means in the code.**  A run is flagged `diverged` by `scripts/run_sweep.py` when a
  model parameter or the training loss of any round is not finite; the run still completes and its final metrics
  are those of the model with non-finite parameters, whose prediction is class 0 for every test record (argmax of
  non-finite logits).  For stored runs that predate the flag it is recomputed from the per-round file (non-finite
  training loss).  A second, different outcome is counted separately below: a run with finite losses whose final
  model predicts one class for the whole test set.

  **Are the privatized inputs rescaled or standardized?**  No.  In the stored Experiment 1 runs the released
  coordinates pass only through the public affine map of [a_j, b_j] to [0, 1] (`ldata.public_scaler`); there is no
  standardization, no clipping of the released values and no division by the noise scale.  The first table gives the
  mean absolute network input per budget next to that of the clean inputs.

  **Adult at eps 1, 2, 5.**  The second table gives the confusion matrix of the final model per seed, recovered
  exactly from the stored accuracy, balanced accuracy and test class counts (the stored runs did not save
  predictions), together with the number of rounds with a non-finite loss and the largest round-mean update norm.
part_B2: |
  Rerun of Experiment 1 with one change: every released coordinate, after the public affine map to [0, 1], is
  divided by sqrt(1 + (sigma_j / Delta_j)^2 / s_j^2) with s_j = 0.25 for every feature of all four datasets (all
  features are in [0, 1] after the public map; the constant is used and not a public standard deviation; no data
  statistic enters).  The test features are divided by the same factor.  Same seeds, budgets, learning rate and
  training settings as the stored runs.  "failed" counts runs flagged as failed numerically (definition in B.1);
  "single-class" counts runs whose final model predicts one class on the whole test set (for stored runs available
  for the binary datasets only).  The stored columns are the stored Experiment 1 table.
part_C: |
  Three versions are reported: the stored runs without update clipping (the source of Table 5.2), the stored runs
  with the fixed bound chosen at eps = 1 (the full-input row of the masking table; eps 1 and 5 only), and the new
  runs with the bound chosen per budget.  Rule for the bound (the rule of the stored masking-table runs, applied per
  budget): C(eps) is the median over rounds of the per-round mean update norm of the stored local DP-SGD run without
  update clipping at that eps, seed 0.  The "recorded DP-SGD run" that fixed the stored bound is the eps = 1, seed 0
  run without update clipping.  At eps = 1 the per-budget rule returns the stored bound, so the stored runs are
  reused there.  The noise multiplier is calibrated per client by the accountant and is the same in all versions of
  a budget.  For the stored runs the per-update norms were not saved: the share of rounds whose mean update norm
  exceeds C is given instead; for the new runs the median update norm before clipping and the share of updates
  clipped are computed from the recorded per-update norms.
part_C3: |
  The two tables come from two different sets of stored runs: Table 5.2 from the runs without update clipping, the
  masking table from the runs with the fixed update clipping bound.  Generated from the run files:
part_D: |
  The recorded values are reproduced by the code path `scores.score_sensitivity(..., "analytic")` ->
  `pipeline.secagg_sum_sensitivity` -> `sigma0(eps1, delta1)`: sigma = sqrt(d) * max_i(n_i * Delta_s(n_i)) / sum_k n_k
  * c(eps1, delta1).  The structure is the task's formula; the per-score sensitivity bound is not.  The code uses
  Delta_s(m) = [theta ln(G / theta) + theta ln(C / theta) + theta ln(G C / theta)] / ln(min(G, C)) with theta = 2 / m
  (entropy-continuity bound for the three entropies of the normalized mutual information, capped at 1), where G is
  the number of bins and C the number of classes; the task's Delta_FG(m) = 3 (1 + ln m) / (m ln 2) gives the values
  in the rows marked "task formula" and does not reproduce the recorded numbers.
part_E: |
  Stored Experiment 3 runs, Adult; accuracy per seed of private selection (secure-aggregation release) and of the
  random k-subset of the same seed; no new runs and no test.
part_F: |
  Uniform release on Adult calibrated to the group-wise l2 sensitivity, squared sensitivity n_numeric +
  2 n_categorical in units of the scaled ranges, instead of d.  Proof sketch: after the public affine map each
  numeric coordinate lies in [0, 1], so replacing a record changes it by at most 1 and the numeric block contributes
  at most n_numeric to the squared l2 distance; each categorical attribute is a one-hot block with exactly one entry
  equal to 1, so two records differ in at most two entries of the block, each by 1, and the block contributes at most
  2; summing over blocks, ||x - x'||_2^2 <= n_numeric + 2 n_categorical, and the Gaussian mechanism with
  sigma = c(eps, delta) * sqrt(n_numeric + 2 n_categorical) per scaled coordinate is (eps, delta)-DP for the
  record.  The bound requires every record to be a valid one-hot encoding; coordinate-wise clipping alone does not
  enforce that, so a client must validate its records before the release (true by construction for the loader's
  records).  The stored uniform release at eps 10 has no update clipping; a reference run with the protocol of the
  other budgets was added and both are shown.
decision_log: |
  Entries of `DECISIONS.md` for this task, verbatim.  The plan entries (D65-D70) were written before the runs and
  cite the commit that precedes them; outcome entries follow them.
deviations: |
  1. Order of the parts: one job queue in the order A, B, C, F on 4 parallel workers; D, E and the diagnostics of
     B.1 and C.1 were computed from stored files while the runs of A and B were in progress.  All decision-log plan
     entries (D65-D70) were written together before the first run and cite the same commit.
  2. Part A, local mode: each client clips its noisy score vector to [0, 1] before the average (the mechanism as
     specified in the repository); the task text does not say so.  The overlap without that clipping is reported as a
     diagnostic.
  3. Parts A and D: the code's sensitivity bound is not the task's Delta_FG formula (Part D).  All runs use the
     code's bound; the task formula's values are printed next to it and no run was made with it.
  4. Part B.1: the stored runs saved no predictions; the Adult confusion matrices are recovered from the stored
     accuracy and balanced accuracy (exact for a binary task; integer check in the script).  The mean absolute input
     of the stored runs is recomputed by re-running the release without training (seed 0).
  5. Part B.2: s_j = 0.25 for all features; the image-data oracle allocation exists in the stored Experiment 1 only
     at eps 1 and 5 and was rerun only there.  The lr / 10 repeat was conditional on a run failing numerically.
  6. Part C.1: per-update norms and the fraction of updates clipped do not exist for the stored runs (replaced by the
     share of rounds whose mean norm exceeds C).  C.2: the rule reads training-side update norms of one seed; it uses
     no test metric but is not data-independent.  The eps = 1 cells of the per-budget version are the stored runs.
  7. Part F: a uniform reference run at eps 10 under the update-clipping protocol was added (not in the task).
  8. The container restarted during Part C; runs in progress were lost and started again from the beginning (completed
     runs were kept and skipped), so the new runs carry several code commits.  The run configuration is unchanged.
